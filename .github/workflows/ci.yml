name: PetroCore Supply CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
